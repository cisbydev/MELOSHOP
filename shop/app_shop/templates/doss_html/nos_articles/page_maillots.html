

<div class="container container_ord my-5">
    <div class="row">
        {% for maillot in all_maillots %}
        <div class="col-md-4 mb-4 ">
            <div class="card shadow-sm h-100" id="all_ord">
                {% if maillot.image_maillot %}
                    <img src="{{ maillot.image_maillot.url }}"  class="card-img-top img_page1" alt="{{ maillot.nom_maillot }}">
                {% else %}
                    <p><h3 class="text-center">Aucune Image Disponible</h3></p>
                {% endif %}

                <div class="card-body p-3">
                    <h5 class="card-title">{{ maillot.nom_maillot }}</h5>
                    <p class="card-text">Prix: {{ maillot.prix_maillot }} FCFA
                        <span><i class="bi bi-star-fill text-warning"></i></span>
                        <span><i class="bi bi-star-fill text-warning"></i></span>
                        <span><i class="bi bi-star-fill text-warning"></i></span>
                    </p>
                    <a href="#" class="btn btn-success w-50">Acheter</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
